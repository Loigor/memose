<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <label>
        Server URL
        <input id="base-url" type="url" placeholder="https://memos.example.com" autocomplete="off" />
      </label>
      <label>
        Access token
        <input id="token" type="password" placeholder="Leave blank to keep the saved token" autocomplete="off" />
      </label>
      <p id="token-hint"></p>
      <div class="actions">
        <button id="save-settings" type="button">Save</button>
        <button id="test-connection" type="button">Test</button>
        <button id="clear-memos" type="button">Disconnect</button>
      </div>
      <div id="memos-audience" hidden>
        <p class="field-label">Visibility</p>
        <div id="visibility-choices" class="choices"></div>
        <p id="memo-space-field" class="field-label">Space</p>
        <div id="space-choices" class="choices"></div>
        <p class="hint">New memos use this audience. A memo you already synced keeps its own audience until you change it on the note.</p>
      </div>
      <label class="check">
        <input id="autostart" type="checkbox" />
        Launch at login
      </label>
      <h2>On a memo</h2>
      <p class="field-label">Modifier</p>
      <div id="gesture" class="choices"></div>
      <p id="gesture-hint" class="hint"></p>
      <h2>Shortcuts</h2>
      <p class="hint">Click a shortcut, then press the keys you want. New memo and Toggle pinned also work from other apps.</p>
      <div id="shortcuts"></div>
      <p id="settings-status" role="status"></p>
    </main>
  </body>
</html>
