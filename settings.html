<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <label>
        Server URL
        <input id="base-url" type="url" placeholder="https://memos.example.com" autocomplete="off" />
      </label>
      <label>
        Access token
        <input id="token" type="password" placeholder="Leave blank to keep the saved token" autocomplete="off" />
      </label>
      <p id="token-hint"></p>
      <div class="actions">
        <button id="save-settings" type="button">Save</button>
        <button id="test-connection" type="button">Test</button>
        <button id="clear-memos" type="button">Disconnect</button>
      </div>
      <label class="check">
        <input id="autostart" type="checkbox" />
        Launch at login
      </label>
      <p id="settings-status" role="status"></p>
    </main>
  </body>
</html>
