<!doctype html>
<html lang="en" spellcheck="false" writingsuggestions="false" translate="no">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.lightbox-window #card { display: none; }
      html.lightbox-window #lightbox { display: flex !important; }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memose</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="frame">
    <div id="notes">
    <main id="card">
      <header>
        <div class="brand">
          <span id="brand-name" class="brand-name">Memose</span>
          <span id="note-title" class="note-title"></span>
          <span class="note-meta">
            <span class="audience-anchor">
              <button id="visibility-label" type="button" hidden>Private</button>
              <div id="audience-pop" hidden>
                <p class="pop-label">Who can see this</p>
                <div id="visibility-choices"></div>
                <div id="space-block" hidden>
                  <p class="pop-label">Space</p>
                  <div id="space-choices"></div>
                </div>
                <div class="audience-foot">
                  <button id="delete-note" type="button">Delete memo</button>
                  <div id="delete-confirm" hidden>
                    <span>Delete this memo?</span>
                    <span class="audience-confirm-actions">
                      <button id="delete-no" type="button">Cancel</button>
                      <button id="delete-yes" type="button">Delete</button>
                    </span>
                  </div>
                </div>
              </div>
            </span>
            <span id="edited-sep" hidden>|</span>
            <span id="edited-at" hidden></span>
          </span>
        </div>
        <div class="header-actions">
          <div class="markdown-anchor">
            <button id="markdown-toggle" type="button" aria-label="Markdown" aria-expanded="false">M</button>
            <div id="markdown-pop" hidden>
              <button type="button" data-markdown="bold" aria-label="Bold">B</button>
              <button type="button" data-markdown="italic" aria-label="Italic">I</button>
              <button type="button" data-markdown="title" aria-label="Title">T</button>
              <button type="button" data-markdown="task" aria-label="Task list">[ ]</button>
              <button type="button" data-markdown="code" aria-label="Code">&lt;&gt;</button>
            </div>
          </div>
          <button id="mode-toggle" type="button" aria-label="Preview" aria-pressed="false">Preview</button>
          <div class="theme-anchor">
            <button id="theme-toggle" class="theme-toggle icon-button" type="button" aria-label="Dark theme">
              <svg id="theme-icon" class="theme-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"></svg>
            </button>
            <div id="color-pop" class="color-pop" hidden>
              <div class="hue-track">
                <input id="hue-slider" type="range" min="0" max="359" value="48" aria-label="Hue" />
              </div>
              <div id="hue-slots">
                <button type="button" class="hue-slot" aria-label="Saved color 1"></button>
                <button type="button" class="hue-slot" aria-label="Saved color 2"></button>
                <button type="button" class="hue-slot" aria-label="Saved color 3"></button>
                <button type="button" class="hue-slot" aria-label="Saved color 4"></button>
                <button type="button" class="hue-slot" aria-label="Saved color 5"></button>
                <button type="button" class="hue-slot" aria-label="Saved color 6"></button>
                <button id="hue-add" type="button" aria-label="Save hue">+</button>
              </div>
            </div>
          </div>
          <button id="pin-toggle" class="pin-toggle icon-button" type="button" aria-label="Pin" aria-pressed="false">
            <span class="pin-glyph" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section id="composer-view">
        <div id="note-pane">
          <div id="conflict" hidden>
            <p>This memo changed here and in useMemos.</p>
            <div>
              <button id="conflict-local" type="button">Keep this</button>
              <button id="conflict-remote" type="button">Use server</button>
            </div>
          </div>
          <div id="blocks"></div>
          <div id="preview" hidden></div>
        </div>
        <div id="memo-list">
          <input id="recent-search" type="search" placeholder="Search" aria-label="Search memos" autocomplete="off" hidden />
          <ul id="recent"></ul>
        </div>
        <button id="recent-more" type="button" hidden>More</button>
      </section>
    </main>
    <div id="stack"></div>
    </div>
    </div>
    <div id="resize-grip" aria-hidden="true"></div>
    <div id="lightbox">
      <img id="lightbox-image" alt="" />
    </div>
  </body>
</html>
