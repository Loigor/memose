name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<package.json version>, e.g. v1.0.0)"
        required: false
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Validate & Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version synchronization
        run: node release/sync-version.mjs --check

      - name: Build frontend and run contract tests
        run: |
          npm run build
          npm run test:ts

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          EXPECTED_TAG="v${VERSION}"
          if [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
            if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
              echo "Tag ${TAG} does not match package.json version (${EXPECTED_TAG})." >&2
              exit 1
            fi
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
              echo "Input tag ${TAG} does not match package.json version (${EXPECTED_TAG})." >&2
              exit 1
            fi
          else
            TAG="${EXPECTED_TAG}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release ${TAG} (version ${VERSION})"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            run_rust_tests: true
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            run_rust_tests: false
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            run_rust_tests: true
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            run_rust_tests: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            file \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust Clippy & unit tests
        if: matrix.run_rust_tests
        run: |
          npm run lint:rust
          npm run test:rust

      - name: Build release bundles
        env:
          CI: "true"
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: node release/build.mjs --target ${{ matrix.target }}

      - name: Upload platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release/${{ matrix.platform }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Memose ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
